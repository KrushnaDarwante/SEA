# =======================================================================
# SEA Backend Configuration
# =======================================================================

spring.application.name=sea-backend
server.port=${PORT:8080}

# Database Connection (MySQL 8.0 with cloud env fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sea_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring Security & JWT Properties
sea.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
sea.jwt.expiration-ms=86400000

# QR Verification HMAC Salt
sea.qr.secret-salt=${QR_SALT:MATOSHRI-MCERC-2026-SEA-SECURE-SALT}

# CORS Configuration
sea.cors.allowed-origins=*

# Logging
logging.level.com.sea=INFO
logging.level.org.springframework.security=WARN
