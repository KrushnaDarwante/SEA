<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overall Report — SEA | Matoshri College of Engineering & RC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
    :root {
        --primary: #0b3d91;
        --primary-dark: #082c6b;
        --accent: #c9a227;
        --accent-light: #e6c458;
        --dark: #0f172a;
        --gray-700: #334155;
        --gray-500: #64748b;
        --success: #059669;
        --danger: #dc2626;
        --warning: #d97706;
        --info: #0891b2;
        --purple: #7c3aed;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Inter', sans-serif;
        background: #f4f6fa;
        color: var(--dark);
        min-height: 100vh;
        line-height: 1.6;
    }
    h1, h2, h3, h4 { font-family: 'Playfair Display', serif; font-weight: 700; }

    /* NAVBAR */
    .navbar-pro {
        background: white;
        border-bottom: 1px solid #e2e8f0;
        padding: 12px 0;
        position: sticky;
        top: 0;
        z-index: 1000;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .navbar-pro .container-pro {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1100px;
        padding: 0 24px;
        margin: 0 auto;
        gap: 12px;
    }
    .nav-brand { display: flex; align-items: center; gap: 12px; }
    .nav-brand-icon {
        width: 44px; height: 44px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 11px;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .nav-brand-icon svg { width: 100%; height: 100%; }
    .nav-brand-text h5 { margin: 0; font-size: 1rem; font-family: 'Playfair Display', serif; }
    .nav-brand-text small { color: var(--gray-500); font-size: 0.72rem; }
    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .user-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px 6px 6px;
        background: #f1f5f9;
        border-radius: 50px;
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--gray-700);
    }
    .user-avatar {
        width: 32px; height: 32px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 0.85rem;
        font-weight: 600;
    }
    .btn-logout {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 9px;
        border: 1.5px solid #e2e8f0;
        background: white;
        color: var(--gray-700);
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s;
    }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger); background: #fef2f2; }

    /* MAIN */
    .page-wrap {
        padding: 32px 24px 40px;
        max-width: 1100px;
        margin: 0 auto;
    }

    .back-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 12px;
    }
    .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        background: white;
        color: var(--gray-700);
        border: 1.5px solid #e2e8f0;
        border-radius: 10px;
        font-size: 0.85rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.25s;
        font-family: 'Inter', sans-serif;
    }
    .btn-back:hover { border-color: var(--primary); color: var(--primary); }

    /* HEADER */
    .page-header-card {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        border-radius: 20px;
        padding: 28px 32px;
        margin-bottom: 24px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
    }
    .page-header-card::before {
        content: '';
        position: absolute;
        top: -80px; right: -80px;
        width: 280px; height: 280px;
        background: radial-gradient(circle, rgba(201, 162, 39, 0.2), transparent 70%);
        border-radius: 50%;
    }
    .page-header-text { position: relative; z-index: 2; }
    .page-header-text h1 { color: white; font-size: 1.5rem; margin-bottom: 4px; line-height: 1.2; }
    .page-header-text h1 span { color: var(--accent-light); }
    .page-header-text p { color: rgba(255, 255, 255, 0.8); font-size: 0.85rem; margin: 0; }
    .page-header-icon {
        position: relative;
        z-index: 2;
        width: 70px; height: 70px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: var(--accent-light);
        flex-shrink: 0;
        backdrop-filter: blur(10px);
    }

    /* STATS GRID */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 24px;
    }
    .stat-card {
        background: white;
        border-radius: 16px;
        padding: 20px;
        border: 1px solid #e2e8f0;
        text-align: center;
        transition: all 0.3s;
        position: relative;
        overflow: hidden;
    }
    .stat-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 4px;
    }
    .stat-card.halls::before { background: linear-gradient(90deg, #0b3d91, #1e5bc6); }
    .stat-card.students::before { background: linear-gradient(90deg, #0891b2, #06b6d4); }
    .stat-card.present::before { background: linear-gradient(90deg, #059669, #10b981); }
    .stat-card.percent::before { background: linear-gradient(90deg, #d97706, #f59e0b); }

    .stat-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08); }

    .stat-card h3 {
        font-family: 'Inter', sans-serif;
        font-size: 2rem;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 6px;
    }
    .stat-card.halls h3 { color: var(--primary); }
    .stat-card.students h3 { color: var(--info); }
    .stat-card.present h3 { color: var(--success); }
    .stat-card.percent h3 { color: var(--warning); }

    .stat-card small {
        color: var(--gray-500);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 700;
    }

    /* DOWNLOAD BAR */
    .download-bar {
        background: white;
        border-radius: 14px;
        border: 1px solid #e2e8f0;
        padding: 16px 20px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
    }
    .download-label {
        font-size: 0.82rem;
        color: var(--gray-700);
        font-weight: 600;
    }
    .download-label i { color: var(--primary); margin-right: 6px; }
    .download-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-download {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s;
        font-family: 'Inter', sans-serif;
        border: 1.5px solid transparent;
    }
    .btn-csv {
        background: white;
        border-color: #e2e8f0;
        color: var(--success);
    }
    .btn-csv:hover {
        border-color: var(--success);
        background: #f0fdf4;
        transform: translateY(-2px);
    }
    .btn-pdf {
        background: white;
        border-color: #e2e8f0;
        color: var(--danger);
    }
    .btn-pdf:hover {
        border-color: var(--danger);
        background: #fef2f2;
        transform: translateY(-2px);
    }
    .btn-print {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
    }
    .btn-print:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(11, 61, 145, 0.3);
        color: white;
    }

    /* FILTER TABS */
    .filter-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        overflow-x: auto;
        padding-bottom: 4px;
    }
    .filter-tabs::-webkit-scrollbar { height: 0; }
    .filter-tab {
        padding: 9px 18px;
        border-radius: 50px;
        border: 1.5px solid #e2e8f0;
        background: white;
        color: var(--gray-700);
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s;
        white-space: nowrap;
        font-family: 'Inter', sans-serif;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .filter-tab:hover { border-color: var(--primary); color: var(--primary); }
    .filter-tab.active {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        border-color: var(--primary-dark);
        box-shadow: 0 4px 12px rgba(11, 61, 145, 0.25);
    }

    /* HALL CARDS */
    .halls-section {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        margin-bottom: 24px;
    }
    .hall-summary-card {
        background: white;
        border-radius: 16px;
        border: 1px solid #e2e8f0;
        padding: 20px 22px;
        transition: all 0.3s;
        border-left: 4px solid var(--primary);
    }
    .hall-summary-card:hover {
        transform: translateX(3px);
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
    }
    .hall-summary-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 14px;
        flex-wrap: wrap;
        gap: 10px;
    }
    .hall-summary-title {
        flex: 1;
        min-width: 200px;
    }
    .hall-summary-title h4 {
        font-family: 'Inter', sans-serif;
        font-size: 1rem;
        font-weight: 700;
        margin: 0 0 4px;
        color: var(--dark);
    }
    .hall-summary-title p {
        margin: 0;
        font-size: 0.78rem;
        color: var(--gray-500);
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
    }
    .hall-summary-title p span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }
    .hall-summary-title p i { color: var(--primary); font-size: 0.75rem; }

    .hall-summary-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 12px;
        border-radius: 50px;
        font-size: 0.72rem;
        font-weight: 700;
        flex-shrink: 0;
    }
    .hall-summary-badge.excellent { background: #d1fae5; color: #065f46; }
    .hall-summary-badge.good { background: #dbeafe; color: #1e40af; }
    .hall-summary-badge.average { background: #fef3c7; color: #78350f; }
    .hall-summary-badge.poor { background: #fee2e2; color: #991b1b; }

    .hall-stats-mini {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 12px;
    }
    .hall-stat-box {
        background: #f8fafc;
        border-radius: 10px;
        padding: 10px 8px;
        text-align: center;
        border: 1px solid #f1f5f9;
    }
    .hall-stat-box h5 {
        font-family: 'Inter', sans-serif;
        font-size: 1.1rem;
        font-weight: 700;
        margin: 0 0 2px;
    }
    .hall-stat-box.total h5 { color: var(--primary); }
    .hall-stat-box.present h5 { color: var(--success); }
    .hall-stat-box.absent h5 { color: var(--danger); }
    .hall-stat-box.percent h5 { color: var(--warning); }
    .hall-stat-box small {
        font-size: 0.6rem;
        color: var(--gray-500);
        text-transform: uppercase;
        letter-spacing: 0.4px;
        font-weight: 700;
    }

    .hall-progress {
        height: 8px;
        background: #f1f5f9;
        border-radius: 4px;
        overflow: hidden;
    }
    .hall-progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #059669, #10b981);
        border-radius: 4px;
        transition: width 0.6s ease;
    }
    .hall-progress-fill.low { background: linear-gradient(90deg, #dc2626, #ef4444); }
    .hall-progress-fill.mid { background: linear-gradient(90deg, #d97706, #f59e0b); }

    /* EMPTY */
    .empty-state {
        text-align: center;
        padding: 60px 20px;
        background: white;
        border-radius: 18px;
        border: 1px dashed #cbd5e1;
        color: var(--gray-500);
    }
    .empty-state i {
        font-size: 3rem;
        color: #cbd5e1;
        display: block;
        margin-bottom: 12px;
    }

    /* TOAST */
    .toast-pro {
        position: fixed;
        top: 90px;
        right: 24px;
        background: var(--success);
        color: white;
        padding: 14px 22px;
        border-radius: 12px;
        font-size: 0.85rem;
        font-weight: 600;
        box-shadow: 0 8px 24px rgba(5, 150, 105, 0.3);
        opacity: 0;
        transform: translateY(-20px);
        transition: all 0.3s;
        z-index: 2000;
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 340px;
    }
    .toast-pro.show { opacity: 1; transform: translateY(0); }
    .toast-pro.error { background: var(--danger); box-shadow: 0 8px 24px rgba(220, 38, 38, 0.3); }
    .toast-pro.info { background: var(--info); box-shadow: 0 8px 24px rgba(8, 145, 178, 0.3); }

    @media (max-width: 768px) {
        .page-wrap { padding: 20px 16px 32px; }
        .page-header-card { flex-direction: column; text-align: center; padding: 24px 20px; gap: 14px; }
        .page-header-text h1 { font-size: 1.3rem; }
        .page-header-icon { width: 58px; height: 58px; font-size: 1.6rem; }
        .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .stat-card { padding: 14px 10px; }
        .stat-card h3 { font-size: 1.5rem; }
        .download-bar { flex-direction: column; align-items: stretch; }
        .download-buttons { width: 100%; }
        .btn-download { flex: 1; justify-content: center; }
        .hall-stats-mini { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 576px) {
        .navbar-pro .container-pro { padding: 0 14px; }
        .user-chip span { display: none; }
        .user-chip { padding: 6px; }
        .btn-logout span { display: none; }
        .btn-logout { padding: 8px 12px; }
        .hall-summary-card { padding: 16px; }
    }
    </style>
</head>
<body>

<nav class="navbar-pro">
    <div class="container-pro">
        <div class="nav-brand">
            <div class="nav-brand-icon">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="ng" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#1e5bc6"/><stop offset="100%" stop-color="#082c6b"/>
                        </linearGradient>
                        <linearGradient id="gg" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#e6c458"/><stop offset="100%" stop-color="#a8841a"/>
                        </linearGradient>
                    </defs>
                    <path d="M50 3 L92 18 L92 50 C92 74 74 89 50 97 C26 89 8 74 8 50 L8 18 Z" fill="url(#gg)"/>
                    <path d="M50 8 L87 21 L87 50 C87 71 71 85 50 92 C29 85 13 71 13 50 L13 21 Z" fill="url(#ng)"/>
                    <text x="50" y="55" text-anchor="middle" font-family="Playfair Display, serif" font-size="24" font-weight="800" fill="url(#gg)">SEA</text>

            </div>

                <h5>SEA</h5>

            </div>

                <div class="user-avatar" id="userAvatar">I</div>

                <span>Logout</span>

</nav>

<div class="page-wrap">

    <div class="back-bar">
        <a href="invigilator-dashboard.html" class="btn-back">
            <i class="bi bi-arrow-left"></i>
            Back to Dashboard
        </a>
    </div>

    <!-- HEADER -->
    <div class="page-header-card">
        <div class="page-header-text">
            <h1>Overall <span>Hall Report</span></h1>
            <p>Combined attendance summary of all assigned halls</p>
        </div>
        <div class="page-header-icon">
            <i class="bi bi-bar-chart-fill"></i>
        </div>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
        <div class="stat-card halls">
            <h3 id="statHalls">0</h3>
            <small>Total Halls</small>
        </div>
        <div class="stat-card students">
            <h3 id="statStudents">0</h3>
            <small>Total Students</small>
        </div>
        <div class="stat-card present">
            <h3 id="statPresent">0</h3>
            <small>Present</small>
        </div>
        <div class="stat-card percent">
            <h3 id="statPercent">0%</h3>
            <small>Overall %</small>
        </div>
    </div>

    <!-- DOWNLOAD BAR -->
    <div class="download-bar">
        <div class="download-label">
            <i class="bi bi-download"></i>
            Download consolidated report
        </div>
        <div class="download-buttons">
            <button class="btn-download btn-csv" onclick="downloadCSV()">
                <i class="bi bi-filetype-csv"></i> CSV
            </button>
            <button class="btn-download btn-pdf" onclick="downloadPDF()">
                <i class="bi bi-file-earmark-pdf-fill"></i> PDF
            </button>
            <button class="btn-download btn-print" onclick="printReport()">
                <i class="bi bi-printer-fill"></i> Print
            </button>
        </div>
    </div>

    <!-- FILTER TABS -->
    <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterHalls('all', this)">
            <i class="bi bi-grid-3x3-gap-fill"></i> All Halls
        </button>
        <button class="filter-tab" onclick="filterHalls('with-data', this)">
            <i class="bi bi-check-circle-fill"></i> With Attendance
        </button>
        <button class="filter-tab" onclick="filterHalls('high', this)">
            <i class="bi bi-graph-up-arrow"></i> 75%+ Attendance
        </button>

    <!-- HALLS SECTION -->

        <p>Please contact the administrator to get halls assigned.</p>

</div>

<div class="toast-pro" id="toast">
    <i class="bi bi-check-circle-fill"></i>
    <span id="toastMsg">Done</span>
</div>

<script>
/* ============ AUTH GUARD ============ */
const user = JSON.parse(sessionStorage.getItem('user') || '{}');
if (!user.success || user.role !== 'invigilator') {
    window.location.href = 'index.html';
}
document.getElementById('userName').textContent = user.name || 'Invigilator';
document.getElementById('userAvatar').textContent = (user.name || 'I').charAt(0).toUpperCase();

/* ============ STATE ============ */
let currentFilter = 'all';
let hallData = [];  /* computed: array of { hallId, hallName, examName, date, supervisor, students, present, absent, percent } */

/* ============ LOAD DATA ============ */
function loadData() {
    const allAssignments = JSON.parse(localStorage.getItem('assignments') || '[]');
    let myAssignments = allAssignments.filter(a => a.supervisorName === user.name);

    /* Fallback: demo hall if none assigned */
    if (myAssignments.length === 0) {
        myAssignments = [{
            hallId: 'H1',
            hallName: 'Hall C (Demo)',
            examName: 'Data Structures',
            date: new Date().toISOString().slice(0, 10),
            supervisorName: user.name
        }];
    }

    hallData = myAssignments.map(a => {
        const students = JSON.parse(localStorage.getItem('students-' + a.hallId) || '[]');
        const attendance = JSON.parse(localStorage.getItem('attendance-' + a.hallId) || '{}');

        /* If no students stored, generate demo */
        let studentList = students;
        if (!studentList || studentList.length === 0) {
            studentList = [];
            for (let i = 1; i <= 30; i++) {
                studentList.push({ id: 'S' + String(i).padStart(3, '0'), roll: 'CS' + (100 + i), name: 'Student ' + i, seat: i });
            }
        }

        const total = studentList.length;
        const present = studentList.filter(s => attendance[s.id]).length;
        const absent = total - present;
        const percent = total > 0 ? Math.round((present / total) * 100) : 0;

        return {
            hallId: a.hallId,
            hallName: a.hallName,
            examName: a.examName,
            date: a.date,
            supervisor: a.supervisorName || user.name,
            total,
            present,
            absent,
            percent
        };
    });
}

/* ============ RENDER ============ */
function renderHalls() {
    const section = document.getElementById('hallsSection');
    const empty = document.getElementById('emptyState');

    /* Apply filter */
    let filtered = hallData;
    if (currentFilter === 'with-data') {
        filtered = hallData.filter(h => h.total > 0);
    } else if (currentFilter === 'high') {
        filtered = hallData.filter(h => h.percent >= 75);
    }

    if (filtered.length === 0) {
        section.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';

    section.innerHTML = filtered.map(h => {
        /* Grade badge */
        let grade = 'poor', gradeText = 'Low';
        if (h.percent >= 90) { grade = 'excellent'; gradeText = 'Excellent'; }
        else if (h.percent >= 75) { grade = 'good'; gradeText = 'Good'; }
        else if (h.percent >= 50) { grade = 'average'; gradeText = 'Average'; }

        /* Progress bar class */
        let fillClass = '';
        if (h.percent < 50) fillClass = 'low';
        else if (h.percent < 75) fillClass = 'mid';

        return `
        <div class="hall-summary-card">
            <div class="hall-summary-header">
                <div class="hall-summary-title">
                    <h4>${h.hallName}</h4>
                    <p>
                        <span><i class="bi bi-journal-text"></i> ${h.examName || '—'}</span>
                        <span><i class="bi bi-calendar3"></i> ${formatDate(h.date)}</span>
                        <span><i class="bi bi-person-badge"></i> ${h.supervisor}</span>
                    </p>
                </div>
                <span class="hall-summary-badge ${grade}">
                    <i class="bi bi-star-fill"></i> ${gradeText}
                </span>
            </div>

            <div class="hall-stats-mini">
                <div class="hall-stat-box total">
                    <h5>${h.total}</h5>
                    <small>Total</small>
                </div>
                <div class="hall-stat-box present">
                    <h5>${h.present}</h5>
                    <small>Present</small>
                </div>
                <div class="hall-stat-box absent">
                    <h5>${h.absent}</h5>
                    <small>Absent</small>
                </div>
                <div class="hall-stat-box percent">
                    <h5>${h.percent}%</h5>
                    <small>Attendance</small>
                </div>
            </div>

            <div class="hall-progress">
                <div class="hall-progress-fill ${fillClass}" style="width:${h.percent}%"></div>
            </div>
        </div>
        `;
    }).join('');
}

function updateStats() {
    const totalHalls = hallData.length;
    const totalStudents = hallData.reduce((s, h) => s + h.total, 0);
    const totalPresent = hallData.reduce((s, h) => s + h.present, 0);
    const overallPercent = totalStudents > 0 ? Math.round((totalPresent / totalStudents) * 100) : 0;

    document.getElementById('statHalls').textContent = totalHalls;
    document.getElementById('statStudents').textContent = totalStudents;
    document.getElementById('statPresent').textContent = totalPresent;
    document.getElementById('statPercent').textContent = overallPercent + '%';
}

/* ============ DOWNLOAD CSV (Req #6) ============ */
function downloadCSV() {
    if (hallData.length === 0) {
        showToast('No data to download', true);
        return;
    }

    const rows = [
        ['Overall Hall Attendance Report — SEA | Matoshri College of Engineering & RC'],
        ['Supervisor', user.name || '—'],
        ['Generated', new Date().toLocaleString('en-IN')],
        [],
        ['Hall', 'Exam', 'Date', 'Supervisor', 'Total', 'Present', 'Absent', 'Attendance %']
    ];

    hallData.forEach(h => {
        rows.push([
            h.hallName,
            h.examName || '',
            h.date ? formatDate(h.date) : '',
            h.supervisor,
            h.total,
            h.present,
            h.absent,
            h.percent + '%'
        ]);
    });

    /* Summary row */
    const totStu = hallData.reduce((s, h) => s + h.total, 0);
    const totPre = hallData.reduce((s, h) => s + h.present, 0);
    const totAbs = totStu - totPre;
    const overallPercent = totStu > 0 ? Math.round((totPre / totStu) * 100) : 0;

    rows.push([]);
    rows.push(['TOTAL', '', '', '', totStu, totPre, totAbs, overallPercent + '%']);

    const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `overall-report-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    showToast('CSV downloaded successfully');
}

/* ============ HELPERS ============ */
function formatDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}

let toastTimer;
function showToast(msg, isError = false, type = 'success') {
    const t = document.getElementById('toast');
    const icon = t.querySelector('i');
    document.getElementById('toastMsg').textContent = msg;
    t.className = 'toast-pro';
    if (isError) t.classList.add('error');
    else if (type === 'info') t.classList.add('info');

    icon.className = isError ? 'bi bi-exclamation-circle-fill'
                  : type === 'info' ? 'bi bi-info-circle-fill'
                  : 'bi bi-check-circle-fill';

    requestAnimationFrame(() => t.classList.add('show'));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

    sessionStorage.clear();

}
