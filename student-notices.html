<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notices — SEA | Matoshri College of Engineering & RC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
    :root {
        --primary: #0b3d91;
        --primary-dark: #082c6b;
        --accent: #c9a227;
        --accent-light: #e6c458;
        --dark: #0f172a;
        --gray-700: #334155;
        --gray-500: #64748b;
        --success: #059669;
        --danger: #dc2626;
        --warning: #d97706;
        --info: #0891b2;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Inter', sans-serif;
        background: #f4f6fa;
        color: var(--dark);
        min-height: 100vh;
        line-height: 1.6;
    }
    h1, h2, h3, h4 { font-family: 'Playfair Display', serif; font-weight: 700; }

    /* NAVBAR */
    .navbar-pro {
        background: white;
        border-bottom: 1px solid #e2e8f0;
        padding: 12px 0;
        position: sticky;
        top: 0;
        z-index: 1000;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .navbar-pro .container-pro {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1100px;
        padding: 0 24px;
        margin: 0 auto;
        gap: 12px;
    }
    .nav-brand { display: flex; align-items: center; gap: 12px; }
    .nav-brand-icon {
        width: 44px; height: 44px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 11px;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .nav-brand-icon svg { width: 100%; height: 100%; }
    .nav-brand-text h5 { margin: 0; font-size: 1rem; font-family: 'Playfair Display', serif; }
    .nav-brand-text small { color: var(--gray-500); font-size: 0.72rem; }
    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .user-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px 6px 6px;
        background: #f1f5f9;
        border-radius: 50px;
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--gray-700);
    }
    .user-avatar {
        width: 32px; height: 32px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 0.85rem;
        font-weight: 600;
    }
    .btn-logout {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 9px;
        border: 1.5px solid #e2e8f0;
        background: white;
        color: var(--gray-700);
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s;
    }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger); background: #fef2f2; }

    /* MAIN */
    .page-wrap {
        padding: 32px 24px 40px;
        max-width: 900px;
        margin: 0 auto;
    }

    .back-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 12px;
    }
    .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        background: white;
        color: var(--gray-700);
        border: 1.5px solid #e2e8f0;
        border-radius: 10px;
        font-size: 0.85rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.25s;
        font-family: 'Inter', sans-serif;
    }
    .btn-back:hover { border-color: var(--primary); color: var(--primary); }

    .page-header-card {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        border-radius: 20px;
        padding: 32px 36px;
        margin-bottom: 24px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
    }
    .page-header-card::before {
        content: '';
        position: absolute;
        top: -80px; right: -80px;
        width: 320px; height: 320px;
        background: radial-gradient(circle, rgba(201, 162, 39, 0.2), transparent 70%);
        border-radius: 50%;
    }
    .page-header-text { position: relative; z-index: 2; }
    .page-header-text h1 {
        color: white;
        font-size: 1.7rem;
        margin-bottom: 6px;
        line-height: 1.2;
    }
    .page-header-text h1 span { color: var(--accent-light); }
    .page-header-text p { color: rgba(255, 255, 255, 0.8); font-size: 0.9rem; margin: 0; }
    .page-header-icon {
        position: relative;
        z-index: 2;
        width: 80px; height: 80px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        color: var(--accent-light);
        flex-shrink: 0;
        backdrop-filter: blur(10px);
    }

    .filter-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        overflow-x: auto;
        padding-bottom: 4px;
        -webkit-overflow-scrolling: touch;
    }
    .filter-tabs::-webkit-scrollbar { height: 0; }

    .filter-tab {
        padding: 9px 18px;
        border-radius: 50px;
        border: 1.5px solid #e2e8f0;
        background: white;
        color: var(--gray-700);
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s;
        white-space: nowrap;
        font-family: 'Inter', sans-serif;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .filter-tab:hover { border-color: var(--primary); color: var(--primary); }
    .filter-tab.active {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        border-color: var(--primary-dark);
        box-shadow: 0 4px 12px rgba(11, 61, 145, 0.25);
    }

    .notices-list { display: flex; flex-direction: column; gap: 14px; }

    .notice-card {
        background: white;
        border-radius: 16px;
        border: 1px solid #e2e8f0;
        overflow: hidden;
        transition: all 0.3s;
        position: relative;
    }
    .notice-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0;
        width: 4px;
        height: 100%;
        background: var(--accent);
        transition: all 0.3s;
    }
    .notice-card.urgent::before { background: var(--danger); }
    .notice-card.info::before { background: var(--info); }
    .notice-card.general::before { background: var(--success); }

    .notice-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
        border-color: #cbd5e1;
    }

    .notice-card-body { padding: 22px 24px; }

    .notice-card-header {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        margin-bottom: 12px;
    }
    .notice-icon-box {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        flex-shrink: 0;
    }
    .notice-icon-box.urgent { background: linear-gradient(135deg, #fef2f2, #fecaca); color: var(--danger); }
    .notice-icon-box.info { background: linear-gradient(135deg, #eff6ff, #dbeafe); color: var(--primary); }
    .notice-icon-box.general { background: linear-gradient(135deg, #fef3c7, #fde68a); color: var(--warning); }

    .notice-header-text { flex: 1; min-width: 0; }
    .notice-category {
        display: inline-block;
        font-size: 0.66rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 50px;
        margin-bottom: 6px;
    }
    .notice-category.urgent { background: #fee2e2; color: #991b1b; }
    .notice-category.info { background: #dbeafe; color: var(--primary); }
    .notice-category.general { background: #fef3c7; color: #78350f; }

    .notice-title {
        font-family: 'Inter', sans-serif;
        font-size: 1rem;
        font-weight: 700;
        color: var(--dark);
        line-height: 1.4;
        margin: 0;
    }

    .notice-message {
        font-size: 0.88rem;
        color: var(--gray-700);
        line-height: 1.7;
        margin-bottom: 14px;
    }

    .notice-meta {
        display: flex;
        align-items: center;
        gap: 16px;
        padding-top: 12px;
        border-top: 1px solid #f1f5f9;
        flex-wrap: wrap;
    }
    .notice-meta-item {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 0.75rem;
        color: var(--gray-500);
        font-weight: 500;
    }
    .notice-meta-item i { font-size: 0.82rem; color: var(--gray-500); }

    .notice-target-badge {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        background: #f1f5f9;
        color: var(--gray-700);
        border-radius: 50px;
        font-size: 0.68rem;
        font-weight: 700;
    }

    .empty-state {
        background: white;
        border-radius: 16px;
        border: 1px dashed #cbd5e1;
        padding: 70px 30px;
        text-align: center;
        color: var(--gray-500);
    }
    .empty-state i { font-size: 3.5rem; color: #cbd5e1; margin-bottom: 16px; display: block; }
    .empty-state h3 {
        font-family: 'Inter', sans-serif;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--gray-700);
        margin-bottom: 6px;
    }

    .page-footer {
        text-align: center;
        padding: 32px 24px 8px;
        font-size: 0.74rem;
        color: var(--gray-500);
        letter-spacing: 0.3px;
    }

    @media (max-width: 768px) {
        .page-wrap { padding: 20px 16px 32px; }
        .page-header-card { flex-direction: column; text-align: center; padding: 24px 20px; gap: 16px; }
        .page-header-text h1 { font-size: 1.4rem; }
        .page-header-icon { width: 64px; height: 64px; font-size: 1.7rem; }
        .notice-card-body { padding: 18px 18px; }
        .notice-title { font-size: 0.95rem; }
        .notice-message { font-size: 0.85rem; }
        .notice-meta { gap: 12px; }
        .notice-target-badge { margin-left: 0; }
    }

    @media (max-width: 576px) {
        .navbar-pro .container-pro { padding: 0 14px; }
        .user-chip span { display: none; }
        .user-chip { padding: 6px; }
        .btn-logout span { display: none; }
        .btn-logout { padding: 8px 12px; }
        .notice-card-header { gap: 12px; }
        .notice-icon-box { width: 40px; height: 40px; font-size: 1.05rem; }
        .notice-title { font-size: 0.9rem; }
        .notice-message { font-size: 0.82rem; }
    }
    </style>
</head>
<body>

<nav class="navbar-pro">
    <div class="container-pro">
        <div class="nav-brand">
            <div class="nav-brand-icon">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="ng" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#1e5bc6"/><stop offset="100%" stop-color="#082c6b"/>
                        </linearGradient>
                        <linearGradient id="gg" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#e6c458"/><stop offset="100%" stop-color="#a8841a"/>
                        </linearGradient>
                    </defs>
                    <path d="M50 3 L92 18 L92 50 C92 74 74 89 50 97 C26 89 8 74 8 50 L8 18 Z" fill="url(#gg)"/>
                    <path d="M50 8 L87 21 L87 50 C87 71 71 85 50 92 C29 85 13 71 13 50 L13 21 Z" fill="url(#ng)"/>
                    <text x="50" y="55" text-anchor="middle" font-family="Playfair Display, serif" font-size="24" font-weight="800" fill="url(#gg)">SEA</text>
                </svg>
            </div>
            <div class="nav-brand-text">
                <h5>SEA</h5>
                <small>Student Portal</small>
            </div>
        </div>
        <div class="nav-actions">
            <div class="user-chip">
                <div class="user-avatar" id="userAvatar">S</div>
                <span id="userName">Student</span>
            </div>
            <button class="btn-logout" onclick="logout()">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </button>
        </div>
    </div>
</nav>

<div class="page-wrap">

    <div class="back-bar">
        <a href="student-dashboard.html" class="btn-back">
            <i class="bi bi-arrow-left"></i>
            Back to Dashboard
        </a>
    </div>

    <div class="page-header-card">
        <div class="page-header-text">
            <h1>Notices &amp; <span>Announcements</span></h1>
            <p>Stay updated with latest exam announcements</p>
        </div>
        <div class="page-header-icon">
            <i class="bi bi-megaphone-fill"></i>
        </div>
    </div>

    <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterNotices('all', this)">
            <i class="bi bi-grid-3x3-gap-fill"></i> All
        </button>
        <button class="filter-tab" onclick="filterNotices('urgent', this)">
            <i class="bi bi-exclamation-triangle-fill"></i> Urgent
        </button>
        <button class="filter-tab" onclick="filterNotices('info', this)">
            <i class="bi bi-info-circle-fill"></i> Info
        </button>
        <button class="filter-tab" onclick="filterNotices('general', this)">
            <i class="bi bi-megaphone-fill"></i> General
        </button>
    </div>

    <div class="notices-list" id="noticesList"></div>

    <div class="empty-state" id="emptyState" style="display: none;">
        <i class="bi bi-inbox"></i>
        <h3>No notices found</h3>
        <p>Check back later for new announcements</p>
    </div>

    <div class="page-footer">
        © 2026 SEA — Seat Exam Allotment | Matoshri College of Engineering & RC
    </div>

</div>

<script>
const user = JSON.parse(sessionStorage.getItem('user') || '{}');
if (!user.success || user.role !== 'student') {
    window.location.href = 'index.html';
}
document.getElementById('userName').textContent = user.name || 'Student';
document.getElementById('userAvatar').textContent = (user.name || 'S').charAt(0).toUpperCase();

const allNotices = [
    {
        id: 1,
        title: 'Exam Rescheduled — Data Structures',
        message: 'The Data Structures exam has been rescheduled to 16-Mar-2026 at 10:00 AM. All students are advised to check their updated seat slips and reach the exam hall 30 minutes before the start time.',
        category: 'urgent',
        target: 'all',
        postedAt: new Date(Date.now() - 2 * 24 * 60 * 60 * 1000).toISOString()
    },
    {
        id: 2,
        title: 'Carry Your College ID Card',
        message: 'It is mandatory to carry your college ID card along with the QR code at the exam hall entrance. Students without valid ID will not be allowed entry.',
        category: 'info',
        target: 'all',
        postedAt: new Date(Date.now() - 5 * 24 * 60 * 60 * 1000).toISOString()
    },
    {
        id: 3,
        title: 'Report 30 Minutes Before Exam',
        message: 'All students must report to their respective exam halls at least 30 minutes before the scheduled exam start time to allow sufficient time for QR verification and seating.',
        category: 'general',
        target: 'all',
        postedAt: new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString()
    },
    {
        id: 4,
        title: 'DBMS Lab Cancelled',
        message: 'The Database Management Systems lab session scheduled for tomorrow has been cancelled due to server maintenance. The session will be rescheduled later this week.',
        category: 'info',
        target: 'CS',
        postedAt: new Date(Date.now() - 1 * 24 * 60 * 60 * 1000).toISOString()
    },
    {
        id: 5,
        title: 'Hall Ticket Available Now',
        message: 'Your exam hall tickets are now available on the SEA portal. Please download the seat slip PDF and QR code. Report any discrepancies to the exam cell immediately.',
        category: 'info',
        target: 'all',
        postedAt: new Date(Date.now() - 3 * 24 * 60 * 60 * 1000).toISOString()
    },
    {
        id: 6,
        title: 'Mobile Phones Prohibited',
        message: 'Mobile phones and any electronic devices are strictly prohibited inside the exam hall. Violation will lead to immediate disqualification from the exam.',
        category: 'urgent',
        target: 'all',
        postedAt: new Date(Date.now() - 4 * 24 * 60 * 60 * 1000).toISOString()
    }
];

const categoryIcons = {
    urgent: 'bi-exclamation-triangle-fill',
    info: 'bi-info-circle-fill',
    general: 'bi-megaphone-fill'
};
const categoryLabels = {
    urgent: 'Urgent',
    info: 'Information',
    general: 'General'
};
const deptMap = {
    all: 'All Students', CS: 'Computer Science', IT: 'Information Technology',
    AI: 'Artificial Intelligence', MECH: 'Mechanical', CIVIL: 'Civil',
    EE: 'Electrical', EJ: 'Electronics'
};

function timeAgo(dateStr) {
    const date = new Date(dateStr);
    const now = new Date();
    const diffMs = now - date;
    const diffMins = Math.floor(diffMs / (1000 * 60));
    const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
    const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

    if (diffMins < 1) return 'Just now';
    if (diffMins < 60) return `${diffMins} min ago`;
    if (diffHours < 24) return `${diffHours} hour${diffHours !== 1 ? 's' : ''} ago`;
    if (diffDays === 1) return 'Yesterday';
    if (diffDays < 7) return `${diffDays} days ago`;
    if (diffDays < 30) return `${Math.floor(diffDays / 7)} week${Math.floor(diffDays / 7) !== 1 ? 's' : ''} ago`;
    return date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}

let currentFilter = 'all';

function renderNotices() {
    const list = document.getElementById('noticesList');
    const empty = document.getElementById('emptyState');

    let filtered = allNotices;
    if (currentFilter !== 'all') {
        filtered = allNotices.filter(n => n.category === currentFilter);
    }
    filtered = [...filtered].sort((a, b) => new Date(b.postedAt) - new Date(a.postedAt));

    if (filtered.length === 0) {
        list.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';

    list.innerHTML = filtered.map(n => `
        <div class="notice-card ${n.category}">
            <div class="notice-card-body">
                <div class="notice-card-header">
                    <div class="notice-icon-box ${n.category}">
                        <i class="bi ${categoryIcons[n.category]}"></i>
                    </div>
                    <div class="notice-header-text">
                        <span class="notice-category ${n.category}">
                            ${categoryLabels[n.category]}
                        </span>
                        <h3 class="notice-title">${n.title}</h3>
                    </div>
                </div>
                <p class="notice-message">${n.message}</p>
                <div class="notice-meta">
                    <div class="notice-meta-item">
                        <i class="bi bi-clock"></i>
                        ${timeAgo(n.postedAt)}
                    </div>
                    <div class="notice-meta-item">
                        <i class="bi bi-person-check"></i>
                        Exam Cell
                    </div>
                    <span class="notice-target-badge">
                        <i class="bi bi-people-fill"></i> ${deptMap[n.target] || n.target}
                    </span>
                </div>
            </div>
        </div>
    `).join('');
}

function filterNotices(category, btn) {
    currentFilter = category;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderNotices();
}

function logout() {
    sessionStorage.clear();
    window.location.href = 'index.html';
}

renderNotices();
</script>

</body>
</html>
