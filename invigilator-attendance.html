<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Attendance — SEA | Matoshri College of Engineering & RC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
    :root {
        --primary: #0b3d91;
        --primary-dark: #082c6b;
        --accent: #c9a227;
        --accent-light: #e6c458;
        --dark: #0f172a;
        --gray-700: #334155;
        --gray-500: #64748b;
        --success: #059669;
        --danger: #dc2626;
        --warning: #d97706;
        --info: #0891b2;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Inter', sans-serif;
        background: #f4f6fa;
        color: var(--dark);
        min-height: 100vh;
        line-height: 1.6;
    }
    h1, h2, h3, h4 { font-family: 'Playfair Display', serif; font-weight: 700; }

    /* NAVBAR */
    .navbar-pro {
        background: white;
        border-bottom: 1px solid #e2e8f0;
        padding: 12px 0;
        position: sticky;
        top: 0;
        z-index: 1000;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .navbar-pro .container-pro {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1000px;
        padding: 0 24px;
        margin: 0 auto;
        gap: 12px;
    }
    .nav-brand { display: flex; align-items: center; gap: 12px; }
    .nav-brand-icon {
        width: 44px; height: 44px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 11px;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .nav-brand-icon svg { width: 100%; height: 100%; }
    .nav-brand-text h5 { margin: 0; font-size: 1rem; font-family: 'Playfair Display', serif; }
    .nav-brand-text small { color: var(--gray-500); font-size: 0.72rem; }
    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .user-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px 6px 6px;
        background: #f1f5f9;
        border-radius: 50px;
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--gray-700);
    }
    .user-avatar {
        width: 32px; height: 32px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 0.85rem;
        font-weight: 600;
    }
    .btn-logout {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 9px;
        border: 1.5px solid #e2e8f0;
        background: white;
        color: var(--gray-700);
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s;
    }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger); background: #fef2f2; }

    /* MAIN */
    .page-wrap {
        padding: 32px 24px 40px;
        max-width: 1000px;
        margin: 0 auto;
    }

    .back-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 12px;
    }
    .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        background: white;
        color: var(--gray-700);
        border: 1.5px solid #e2e8f0;
        border-radius: 10px;
        font-size: 0.85rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.25s;
        font-family: 'Inter', sans-serif;
    }
    .btn-back:hover { border-color: var(--primary); color: var(--primary); }

    .page-header-card {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        border-radius: 20px;
        padding: 28px 32px;
        margin-bottom: 24px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
    }
    .page-header-card::before {
        content: '';
        position: absolute;
        top: -80px; right: -80px;
        width: 280px; height: 280px;
        background: radial-gradient(circle, rgba(201, 162, 39, 0.2), transparent 70%);
        border-radius: 50%;
    }
    .page-header-text { position: relative; z-index: 2; }
    .page-header-text h1 { color: white; font-size: 1.5rem; margin-bottom: 4px; line-height: 1.2; }
    .page-header-text h1 span { color: var(--accent-light); }
    .page-header-text p { color: rgba(255, 255, 255, 0.8); font-size: 0.85rem; margin: 0; }
    .page-header-icon {
        position: relative;
        z-index: 2;
        width: 70px; height: 70px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: var(--accent-light);
        flex-shrink: 0;
        backdrop-filter: blur(10px);
    }

    /* STATS GRID */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-bottom: 24px;
    }
    .stat-card {
        background: white;
        border-radius: 16px;
        padding: 22px;
        border: 1px solid #e2e8f0;
        text-align: center;
        transition: all 0.3s;
        position: relative;
        overflow: hidden;
    }
    .stat-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 4px;
    }
    .stat-card.verified::before { background: linear-gradient(90deg, #059669, #10b981); }
    .stat-card.pending::before { background: linear-gradient(90deg, #d97706, #f59e0b); }
    .stat-card.total::before { background: linear-gradient(90deg, #0b3d91, #1e5bc6); }

    .stat-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08); }

    .stat-card h3 {
        font-family: 'Inter', sans-serif;
        font-size: 2.2rem;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 6px;
    }
    .stat-card.verified h3 { color: var(--success); }
    .stat-card.pending h3 { color: var(--warning); }
    .stat-card.total h3 { color: var(--primary); }

    .stat-card small {
        color: var(--gray-500);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 700;
    }

    /* PROGRESS BAR */
    .progress-section {
        background: white;
        border-radius: 16px;
        border: 1px solid #e2e8f0;
        padding: 22px 24px;
        margin-bottom: 24px;
    }
    .progress-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        flex-wrap: wrap;
        gap: 10px;
    }
    .progress-header h4 {
        font-family: 'Inter', sans-serif;
        font-size: 0.95rem;
        font-weight: 700;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .progress-header h4 i { color: var(--primary); }
    .progress-percent { font-family: 'Inter', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--success); }
    .progress-bar-custom {
        width: 100%; height: 12px;
        background: #f1f5f9;
        border-radius: 6px;
        overflow: hidden;
        position: relative;
    }
    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #059669, #10b981);
        border-radius: 6px;
        transition: width 0.6s ease;
        position: relative;
        overflow: hidden;
    }
    .progress-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.3) 50%, transparent 100%);
        animation: shimmer 2s infinite;
    }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

    /* FILTER TABS */
    .filter-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        overflow-x: auto;
        padding-bottom: 4px;
    }
    .filter-tabs::-webkit-scrollbar { height: 0; }
    .filter-tab {
        padding: 9px 18px;
        border-radius: 50px;
        border: 1.5px solid #e2e8f0;
        background: white;
        color: var(--gray-700);
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s;
        white-space: nowrap;
        font-family: 'Inter', sans-serif;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .filter-tab:hover { border-color: var(--primary); color: var(--primary); }
    .filter-tab.active {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        border-color: var(--primary-dark);
        box-shadow: 0 4px 12px rgba(11, 61, 145, 0.25);
    }

    /* ATTENDANCE LIST */
    .attendance-card {
        background: white;
        border-radius: 18px;
        border: 1px solid #e2e8f0;
        padding: 24px;
    }
    .attendance-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        padding-bottom: 14px;
        border-bottom: 1px solid #e2e8f0;
        flex-wrap: wrap;
        gap: 10px;
    }
    .attendance-card-header h4 {
        font-family: 'Inter', sans-serif;
        font-size: 1rem;
        font-weight: 700;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .attendance-card-header h4 i { color: var(--primary); }
    .attendance-count {
        font-size: 0.72rem;
        color: var(--gray-500);
        background: #f1f5f9;
        padding: 4px 12px;
        border-radius: 50px;
        font-weight: 700;
    }

    .attendance-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        background: #f8fafc;
        border-radius: 12px;
        margin-bottom: 10px;
        border-left: 3px solid #cbd5e1;
        transition: all 0.3s;
    }
    .attendance-row:last-child { margin-bottom: 0; }
    .attendance-row.verified { background: #f0fdf4; border-left-color: var(--success); }
    .attendance-row.verified:hover { background: #dcfce7; }
    .attendance-row.pending:hover { background: #f1f5f9; }

    .attendance-left { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
    .attendance-avatar {
        width: 40px; height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.9rem;
        font-weight: 700;
        flex-shrink: 0;
    }
    .attendance-row.verified .attendance-avatar { background: linear-gradient(135deg, var(--success), #10b981); }

    .attendance-info { flex: 1; min-width: 0; }
    .attendance-info .roll { font-weight: 700; color: var(--dark); font-size: 0.9rem; margin-bottom: 2px; }
    .attendance-info .seat { font-size: 0.75rem; color: var(--gray-500); display: flex; align-items: center; gap: 5px; }
    .attendance-info .seat i { font-size: 0.7rem; }

    .attendance-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 12px;
        border-radius: 50px;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.3px;
    }
    .status-badge.verified { background: #d1fae5; color: #065f46; }
    .status-badge.pending { background: #fef3c7; color: #78350f; }

    .check-icon {
        width: 32px; height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        transition: all 0.3s;
    }
    .check-icon.verified { background: var(--success); color: white; }
    .check-icon.pending { background: #e2e8f0; color: #94a3b8; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--gray-500); }
    .empty-state i { font-size: 3rem; color: #cbd5e1; margin-bottom: 12px; display: block; }

    .page-footer { text-align: center; padding: 24px 24px 8px; font-size: 0.74rem; color: var(--gray-500); }

    @media (max-width: 768px) {
        .page-wrap { padding: 20px 16px 32px; }
        .page-header-card { flex-direction: column; text-align: center; padding: 24px 20px; gap: 14px; }
        .page-header-text h1 { font-size: 1.3rem; }
        .page-header-icon { width: 58px; height: 58px; font-size: 1.6rem; }
        .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .stat-card { padding: 16px 10px; }
        .stat-card h3 { font-size: 1.6rem; }
        .stat-card small { font-size: 0.62rem; }
        .attendance-card { padding: 18px; }
    }

    @media (max-width: 576px) {
        .navbar-pro .container-pro { padding: 0 14px; }
        .user-chip span { display: none; }
        .user-chip { padding: 6px; }
        .btn-logout span { display: none; }
        .btn-logout { padding: 8px 12px; }
        .attendance-row { padding: 12px 12px; }
        .attendance-avatar { width: 36px; height: 36px; font-size: 0.82rem; }
        .attendance-info .roll { font-size: 0.85rem; }
        .status-badge { padding: 4px 10px; font-size: 0.62rem; }
    }
    </style>
</head>
<body>

<nav class="navbar-pro">
    <div class="container-pro">
        <div class="nav-brand">
            <div class="nav-brand-icon">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="ng" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#1e5bc6"/><stop offset="100%" stop-color="#082c6b"/>
                        </linearGradient>
                        <linearGradient id="gg" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#e6c458"/><stop offset="100%" stop-color="#a8841a"/>
                        </linearGradient>
                    </defs>
                    <path d="M50 3 L92 18 L92 50 C92 74 74 89 50 97 C26 89 8 74 8 50 L8 18 Z" fill="url(#gg)"/>
                    <path d="M50 8 L87 21 L87 50 C87 71 71 85 50 92 C29 85 13 71 13 50 L13 21 Z" fill="url(#ng)"/>
                    <text x="50" y="55" text-anchor="middle" font-family="Playfair Display, serif" font-size="24" font-weight="800" fill="url(#gg)">SEA</text>
                </svg>
            </div>
            <div class="nav-brand-text">
                <h5>SEA</h5>
                <small>Invigilator Portal</small>
            </div>
        </div>
        <div class="nav-actions">
            <div class="user-chip">
                <div class="user-avatar" id="userAvatar">I</div>
                <span id="userName">Invigilator</span>
            </div>
            <button class="btn-logout" onclick="logout()">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </button>
        </div>
    </div>
</nav>

<div class="page-wrap">

    <div class="back-bar">
        <a href="invigilator-dashboard.html" class="btn-back">
            <i class="bi bi-arrow-left"></i>
            Back to Dashboard
        </a>
    </div>

    <div class="page-header-card">
        <div class="page-header-text">
            <h1>Live <span>Attendance</span></h1>
            <p>Real-time verification status for Hall C</p>
        </div>
        <div class="page-header-icon">
            <i class="bi bi-person-check-fill"></i>
        </div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
        <div class="stat-card verified">
            <h3 id="statVerified">0</h3>
            <small>Verified</small>
        </div>
        <div class="stat-card pending">
            <h3 id="statPending">0</h3>
            <small>Pending</small>
        </div>
        <div class="stat-card total">
            <h3 id="statTotal">0</h3>
            <small>Total</small>
        </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-section">
        <div class="progress-header">
            <h4><i class="bi bi-graph-up-arrow"></i> Entry Progress</h4>
            <span class="progress-percent" id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-custom">
            <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
        </div>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterAttendance('all', this)">
            <i class="bi bi-grid-3x3-gap-fill"></i> All
        </button>
        <button class="filter-tab" onclick="filterAttendance('verified', this)">
            <i class="bi bi-check-circle-fill"></i> Verified
        </button>
        <button class="filter-tab" onclick="filterAttendance('pending', this)">
            <i class="bi bi-clock-fill"></i> Pending
        </button>
    </div>

    <!-- Attendance List -->
    <div class="attendance-card">
        <div class="attendance-card-header">
            <h4><i class="bi bi-list-check"></i> Student List</h4>
            <span class="attendance-count" id="attendanceCount">0 students</span>
        </div>

        <div id="attendanceList"></div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <i class="bi bi-inbox"></i>
            <p>No students found</p>
        </div>
    </div>

    <div class="page-footer">
        © 2026 SEA — Seat Exam Allotment | Matoshri College of Engineering & RC
    </div>

</div>

<script>
const user = JSON.parse(sessionStorage.getItem('user') || '{}');
if (!user.success || user.role !== 'invigilator') {
    window.location.href = 'index.html';
}
document.getElementById('userName').textContent = user.name || 'Invigilator';
document.getElementById('userAvatar').textContent = (user.name || 'I').charAt(0).toUpperCase();

let attendance = [
    { roll: '2026CS001', name: 'Rahul Sharma', seat: 'R3-C5', verified: true, time: '09:42 AM' },
    { roll: '2026CS002', name: 'Priya Patel', seat: 'R3-C6', verified: true, time: '09:44 AM' },
    { roll: '2026CS003', name: 'Amit Kumar', seat: 'R3-C7', verified: true, time: '09:46 AM' },
    { roll: '2026CS004', name: 'Sneha Joshi', seat: 'R3-C8', verified: false, time: null },
    { roll: '2026CS005', name: 'Vikas Rao', seat: 'R3-C9', verified: true, time: '09:50 AM' },
    { roll: '2026CS006', name: 'Neha Gupta', seat: 'R4-C1', verified: true, time: '09:52 AM' },
    { roll: '2026CS007', name: 'Arjun Mehta', seat: 'R4-C2', verified: false, time: null },
    { roll: '2026CS008', name: 'Riya Singh', seat: 'R4-C3', verified: true, time: '09:55 AM' },
    { roll: '2026CS009', name: 'Karan Verma', seat: 'R4-C4', verified: false, time: null },
    { roll: '2026CS010', name: 'Pooja Sharma', seat: 'R4-C5', verified: true, time: '10:00 AM' }
];

let currentFilter = 'all';

function updateStats() {
    const verified = attendance.filter(a => a.verified).length;
    const total = attendance.length;
    const pending = total - verified;
    const percent = total > 0 ? Math.round((verified / total) * 100) : 0;

    document.getElementById('statVerified').textContent = verified;
    document.getElementById('statPending').textContent = pending;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('progressPercent').textContent = percent + '%';
    document.getElementById('progressFill').style.width = percent + '%';
}

function renderAttendance() {
    const list = document.getElementById('attendanceList');
    const empty = document.getElementById('emptyState');

    let filtered = attendance;
    if (currentFilter === 'verified') {
        filtered = attendance.filter(a => a.verified);
    } else if (currentFilter === 'pending') {
        filtered = attendance.filter(a => !a.verified);
    }

    document.getElementById('attendanceCount').textContent =
        `${filtered.length} student${filtered.length !== 1 ? 's' : ''}`;

    if (filtered.length === 0) {
        list.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';

    list.innerHTML = filtered.map(a => `
        <div class="attendance-row ${a.verified ? 'verified' : 'pending'}">
            <div class="attendance-left">
                <div class="attendance-avatar">${a.name.charAt(0)}</div>
                <div class="attendance-info">
                    <div class="roll">${a.roll}</div>
                    <div class="seat">
                        <i class="bi bi-geo-alt-fill"></i>
                        ${a.seat}
                        ${a.verified && a.time ? ` • <i class="bi bi-clock"></i> ${a.time}` : ''}
                    </div>
                </div>
            </div>
            <div class="attendance-right">
                <span class="status-badge ${a.verified ? 'verified' : 'pending'}">
                    <i class="bi bi-${a.verified ? 'check-circle-fill' : 'clock-fill'}"></i>
                    ${a.verified ? 'Verified' : 'Pending'}
                </span>
                <div class="check-icon ${a.verified ? 'verified' : 'pending'}">
                    <i class="bi ${a.verified ? 'bi-check-lg' : 'bi-clock'}"></i>
                </div>
            </div>
        </div>
    `).join('');
}

function filterAttendance(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderAttendance();
}

/* Auto refresh every 10 seconds (demo simulation) */
setInterval(() => {
    const pending = attendance.filter(a => !a.verified);
    if (pending.length > 0 && Math.random() > 0.7) {
        const student = pending[Math.floor(Math.random() * pending.length)];
        student.verified = true;
        const now = new Date();
        student.time = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
        updateStats();
        renderAttendance();
    }
}, 10000);

function logout() {
    sessionStorage.clear();
    window.location.href = 'index.html';
}

updateStats();
renderAttendance();
</script>
